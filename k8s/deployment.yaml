apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  labels: { app: wisecow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wisecow }
  template:
    metadata:
      labels: { app: wisecow }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wisecow
          image: wisecow
          ports:
            - { name: http, containerPort: 4499 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # the only writable path: holds the named pipe
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
