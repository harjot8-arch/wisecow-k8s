# Gateway API (the successor to Ingress). TLS terminates here; plain HTTP is
# redirected to HTTPS. Works with any conformant controller (Envoy Gateway in CI).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wisecow
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: wisecow.local
    - name: https
      protocol: HTTPS
      port: 443
      hostname: wisecow.local
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: wisecow-tls }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wisecow
spec:
  parentRefs:
    - { name: wisecow, sectionName: https }
  hostnames: [wisecow.local]
  rules:
    - backendRefs:
        - { name: wisecow, port: 80 }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # Short max-age on purpose; raise to 1 year once HTTPS is proven stable.
              - { name: Strict-Transport-Security, value: max-age=300 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wisecow-https-redirect
spec:
  parentRefs:
    - { name: wisecow, sectionName: http }
  hostnames: [wisecow.local]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
